<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6" />

  <!-- Metric Grid lines (subtle) -->
  <line x1="14" y1="22" x2="50" y2="22" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.4" />
  <line x1="14" y1="34" x2="50" y2="34" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.4" />
  <line x1="14" y1="46" x2="50" y2="46" stroke="#475569" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- KPI Bars (ascending performance) -->
  <!-- Bar 1: Delivery / Apps -->
  <rect x="16" y="32" width="8" height="14" rx="3" fill="url(#blueGrad)" />

  <!-- Bar 2: Quality / Central -->
  <rect x="28" y="24" width="8" height="22" rx="3" fill="url(#amberGrad)" />

  <!-- Bar 3: Success / Target -->
  <rect x="40" y="16" width="8" height="30" rx="3" fill="url(#emeraldGrad)" />

  <!-- Trend indicator line / star of excellence -->
  <path d="M19 28 L32 20 L44 12" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Quality Star / Dot atop top bar -->
  <polygon points="44,7 45.8,11.2 50.2,11.5 46.8,14.4 47.9,18.8 44,16.4 40.1,18.8 41.2,14.4 37.8,11.5 42.2,11.2" fill="#fbbf24" />
</svg>